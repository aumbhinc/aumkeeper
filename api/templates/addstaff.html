{{ define "addstaff" }}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Staff • AumKeeper ERP</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
:root{
    --primary:#0ea5e9;
    --primary-dark:#0284c7;
    --danger:#ef4444;
    --success:#10b981;

    --bg:#f3f7fb;
    --card:#ffffff;
    --border:#dbe4ee;

    --text:#0f172a;
    --muted:#64748b;

    --shadow:
        0 1px 2px rgba(0,0,0,.04),
        0 8px 24px rgba(15,23,42,.06);

    --radius:18px;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    padding:32px 18px 80px;
}

.staff-editor{max-width:1200px;margin:auto;}

.sticky-banner{
    position:sticky;top:14px;z-index:999;
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 18px;margin-bottom:24px;
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(16px);
    border-radius:20px;
    box-shadow:var(--shadow);
}

.logo-badge{
    width:50px;height:50px;border-radius:16px;
    background:linear-gradient(135deg,#0ea5e9,#2563eb);
    display:flex;align-items:center;justify-content:center;
    color:white;font-size:26px;
}

.banner-left{display:flex;align-items:center;gap:14px;}

.banner-title h1{font-size:20px;font-weight:700;}
.banner-title p{color:var(--muted);font-size:13px;}

.banner-actions{display:flex;gap:12px;}

.btn{border:none;border-radius:14px;padding:12px 18px;cursor:pointer;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;}
.btn-primary{background:var(--primary);color:white;}
.btn-secondary{background:white;border:1px solid var(--border);}
.btn-danger{background:#fff5f5;color:var(--danger);border:1px solid #fecaca;}

.content{display:grid;grid-template-columns:1fr 320px;gap:24px;}

.card{
    background:white;
    border-radius:var(--radius);
    padding:28px;
    box-shadow:var(--shadow);
}

.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}

.form-row-full{grid-column:1/-1;}

label{font-size:14px;font-weight:600;margin-bottom:8px;color:#334155;}

input,textarea{
    width:100%;
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
}

textarea{min-height:140px;resize:vertical;}

.error-msg{color:var(--danger);font-size:13px;margin-top:6px;}

@media(max-width:960px){.content{grid-template-columns:1fr;}}
</style>
</head>

<body>

<div class="staff-editor">

    <div class="sticky-banner">

        <div class="banner-left">
            <div class="logo-badge">
                <span class="material-icons">badge</span>
            </div>

            <div class="banner-title">
                <h1>Add New Staff</h1>
                <p>Create employee onboarding record</p>
            </div>
        </div>

        <div class="banner-actions">
            <button type="button" class="btn btn-secondary" id="goBackBtn">
                <span class="material-icons">arrow_back</span>
                Back
            </button>

            <button type="button" class="btn btn-danger" id="discardBtn">
                <span class="material-icons">delete</span>
                Discard
            </button>

            <button type="submit" form="newStaffForm" class="btn btn-primary">
                <span class="material-icons">save</span>
                Save Staff
            </button>
        </div>

    </div>

    <div class="content">

        <form id="newStaffForm" class="main-form" action="/addstaff" method="POST">

            <div class="card">

                <div class="form-grid">

                    <div class="form-group">
                        <label>First Name</label>
                        <input name="firstName" value="{{.FormData.FirstName}}" required>
                        {{with index .Errors "firstName"}}<div class="error-msg">{{.}}</div>{{end}}
                    </div>

                    <div class="form-group">
                        <label>Middle Name</label>
                        <input name="middleName" value="{{.FormData.MiddleName}}">
                    </div>

                    <div class="form-group">
                        <label>Last Name</label>
                        <input name="lastName" value="{{.FormData.LastName}}" required>
                    </div>

                    <div class="form-group">
                        <label>Role</label>
                        <input name="role" value="{{.FormData.Role}}" required>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input name="email" value="{{.FormData.Email}}" required>
                    </div>

                    <div class="form-group">
                        <label>Phone</label>
                        <input name="phoneNumber" value="{{.FormData.PhoneNumber}}" required>
                    </div>

                </div>

            </div>

            <div class="card">

                <div class="form-grid">

                    <div class="form-group form-row-full">
                        <label>Street</label>
                        <input name="street" value="{{.FormData.Street}}">
                    </div>

                    <div class="form-group">
                        <label>City</label>
                        <input name="city" value="{{.FormData.City}}">
                    </div>

                    <div class="form-group">
                        <label>Zip</label>
                        <input name="zipCode" value="{{.FormData.ZipCode}}">
                    </div>

                </div>

            </div>

            <div class="card">

                <div class="form-grid">

                    <div class="form-group">
                        <label>SSN</label>
                        <input name="ssn" value="{{.FormData.SSN}}">
                    </div>

                    <div class="form-group">
                        <label>Wage</label>
                        <input name="wage" value="{{.FormData.Wage}}">
                    </div>

                    <div class="form-group form-row-full">
                        <label>Comments</label>
                        <textarea name="comments">{{.FormData.Comments}}</textarea>
                    </div>

                </div>

            </div>

        </form>

    </div>

</div>

<script>
document.getElementById("goBackBtn").onclick = () => history.back();
document.getElementById("discardBtn").onclick = () => {
    if(confirm("Discard changes?")) document.getElementById("newStaffForm").reset();
};
</script>

</body>
</html>
{{ end }}
