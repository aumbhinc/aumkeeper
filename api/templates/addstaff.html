{{ define "addstaff" }}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Staff • AumKeeper ERP</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
:root{
    --primary:#0ea5e9;
    --primary-dark:#0284c7;

    --danger:#ef4444;

    --bg:#f6f8fc;
    --text:#0f172a;
    --muted:#64748b;

    --border:rgba(148,163,184,.35);

    --radius:14px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:28px 16px 80px;
}

/* COMMAND BAR */
.sticky-banner{
    position:sticky;
    top:0;
    z-index:1000;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:12px 16px;

    background:rgba(255,255,255,.85);
    backdrop-filter:blur(12px);

    border-bottom:1px solid rgba(15,23,42,.06);
}

.banner-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-badge{
    width:42px;
    height:42px;
    border-radius:12px;

    background:linear-gradient(135deg,#0ea5e9,#2563eb);

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
}

.banner-title h1{
    font-size:16px;
    font-weight:600;
}

.banner-title p{
    font-size:12px;
    color:var(--muted);
}

.banner-actions{
    display:flex;
    gap:10px;
}

/* BUTTONS */
.btn{
    border:none;
    border-radius:10px;
    padding:10px 14px;

    font-weight:600;
    font-size:13px;

    cursor:pointer;

    display:flex;
    align-items:center;
    gap:6px;

    transition:.15s ease;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-primary:hover{
    background:var(--primary-dark);
}

.btn-secondary{
    background:white;
    border:1px solid var(--border);
}

.btn-danger{
    background:#fff5f5;
    color:var(--danger);
    border:1px solid #fecaca;
}

/* LAYOUT */
.content{
    display:grid;
    grid-template-columns:1fr 300px;
    gap:22px;
    max-width:1200px;
    margin:24px auto;
}

/* FORM */
.main-form{
    display:flex;
    flex-direction:column;
    gap:26px;
}

/* CLEAN SECTIONS */
.section{
    padding:0;
}

.section-title{
    font-size:15px;
    font-weight:600;
    margin-bottom:14px;
    padding-bottom:8px;
    border-bottom:1px solid rgba(148,163,184,.25);
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.full{
    grid-column:1/-1;
}

label{
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
    display:block;
    color:#334155;
}

input, textarea{
    width:100%;
    padding:12px 12px;

    border:1px solid var(--border);
    border-radius:10px;

    background:white;

    font-size:14px;

    transition:.15s ease;
}

input:focus, textarea:focus{
    outline:none;
    border-color:rgba(14,165,233,.7);
    box-shadow:0 0 0 3px rgba(14,165,233,.12);
}

textarea{
    min-height:120px;
}

/* SIDEBAR */
.sidebar{
    position:sticky;
    top:80px;
    height:fit-content;
}

.info-box{
    background:white;
    border:1px solid rgba(148,163,184,.25);
    border-radius:14px;
    padding:18px;
}

.info-box h3{
    font-size:14px;
    margin-bottom:12px;
}

.info-item{
    display:flex;
    gap:8px;
    margin-bottom:10px;
    color:var(--muted);
    font-size:13px;
}

.info-item .material-icons{
    font-size:18px;
    color:var(--primary);
}

/* MOBILE */
@media(max-width:900px){
    .content{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- COMMAND BAR -->
<div class="sticky-banner">

    <div class="banner-left">
        <div class="logo-badge">
            <span class="material-icons">badge</span>
        </div>

        <div class="banner-title">
            <h1>Add Staff</h1>
            <p>Onboard employee into AumKeeper ERP</p>
        </div>
    </div>

    <div class="banner-actions">

        <button type="button" class="btn btn-secondary" id="goBackBtn">
            <span class="material-icons">arrow_back</span>
            Back
        </button>

        <button type="button" class="btn btn-danger" id="discardBtn">
            <span class="material-icons">delete</span>
            Discard
        </button>

        <button type="submit" form="newStaffForm" class="btn btn-primary">
            <span class="material-icons">save</span>
            Save
        </button>

    </div>

</div>

<div class="content">

<form id="newStaffForm" class="main-form" action="/addstaff" method="POST">

    <!-- PERSONAL -->
    <div class="section">

        <div class="section-title">Personal Information</div>

        <div class="form-grid">

            <div>
                <label>First Name</label>
                <input name="firstName" value="{{.FormData.FirstName}}" required>
            </div>

            <div>
                <label>Middle Name</label>
                <input name="middleName" value="{{.FormData.MiddleName}}">
            </div>

            <div>
                <label>Last Name</label>
                <input name="lastName" value="{{.FormData.LastName}}" required>
            </div>

            <div>
                <label>Role</label>
                <input name="role" value="{{.FormData.Role}}" required>
            </div>

            <div>
                <label>Email</label>
                <input name="email" value="{{.FormData.Email}}" required>
            </div>

            <div>
                <label>Phone</label>
                <input name="phoneNumber" value="{{.FormData.PhoneNumber}}" required>
            </div>

        </div>
    </div>

    <!-- ADDRESS -->
    <div class="section">

        <div class="section-title">Address</div>

        <div class="form-grid">

            <div class="full">
                <label>Street</label>
                <input name="street" value="{{.FormData.Street}}" required>
            </div>

            <div>
                <label>City</label>
                <input name="city" value="{{.FormData.City}}" required>
            </div>

            <div>
                <label>Zip</label>
                <input name="zipCode" value="{{.FormData.ZipCode}}" required>
            </div>

        </div>
    </div>

    <!-- PAYROLL -->
    <div class="section">

        <div class="section-title">Payroll</div>

        <div class="form-grid">

            <div>
                <label>SSN</label>
                <input name="ssn" value="{{.FormData.SSN}}" required>
            </div>

            <div>
                <label>Dependents</label>
                <input name="dependentClaims" value="{{.FormData.DependentClaims}}">
            </div>

            <div class="full">
                <label>Wage</label>
                <input name="wage" value="{{.FormData.Wage}}" required>
            </div>

            <div class="full">
                <label>Notes</label>
                <textarea name="comments">{{.FormData.Comments}}</textarea>
            </div>

        </div>
    </div>

</form>

<!-- SIDEBAR -->
<aside class="sidebar">

    <div class="info-box">
        <h3>Onboarding Checklist</h3>

        <div class="info-item"><span class="material-icons">check_circle</span>Verify ID</div>
        <div class="info-item"><span class="material-icons">check_circle</span>W-4 Form</div>
        <div class="info-item"><span class="material-icons">check_circle</span>I-9 Verification</div>
        <div class="info-item"><span class="material-icons">check_circle</span>Assign Role</div>
        <div class="info-item"><span class="material-icons">check_circle</span>Timeclock Setup</div>

    </div>

</aside>

</div>

<script>
document.getElementById("goBackBtn").onclick = () => history.back();

document.getElementById("discardBtn").onclick = () => {
    if(confirm("Discard all changes?")){
        document.getElementById("newStaffForm").reset();
    }
};
</script>

</body>
</html>
{{ end }}
