{{ define "timeclock_content" }}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Timeclock • AumKeeper</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --primary:#3498db;
  --in:#27ae60;
  --out:#e74c3c;
  --bg:#f4f6f8;
  --text:#2c3e50;
  --border:#dfe4ea;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* ===== HEADER ===== */
header{
  background:#fff;
  padding:12px 16px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}

h2{font-weight:600}
#clock{color:var(--primary);font-weight:600}

/* ===== SEARCH (PRESERVED DESIGN) ===== */
.search-form{
  display:flex;
  width:100%;
  max-width:400px;
  gap:6px;
}

#search-input{
  flex:1;
  padding:6px 10px;
  border:1px solid var(--border);
  border-radius:6px;
}

#search-button{
  padding:6px 12px;
  border:none;
  border-radius:6px;
  background-color:var(--primary);
  color:#fff;
  font-weight:500;
  cursor:pointer;
}

#search-button:hover{background:#2c80c9}

/* ===== SUMMARY ===== */
#summary{
  background:#fff;
  padding:10px 14px;
  display:flex;
  justify-content:space-between;
  box-shadow:0 1px 3px rgba(0,0,0,.08)
}

main{padding:14px}

#staff-list{list-style:none;display:grid;gap:10px}

/* ===== STAFF ===== */
.staff-item{
  background:#fff;
  padding:12px;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
  cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.08)
}

.staff-item.active{
  border:2px solid var(--primary);
}

/* ===== BUTTONS ===== */
.clock-buttons{
  display:flex;
  gap:10px;
  margin:14px 0
}

button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:6px;
  font-weight:600;
  cursor:pointer;
}

#clock-in{background:var(--in);color:#fff}
#clock-out{background:var(--out);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}

/* ===== TIMER & LOG ===== */
#timer{font-weight:600;margin-bottom:8px}

#log{
  background:#fff;
  border-radius:8px;
  padding:10px;
  max-height:220px;
  overflow:auto;
  font-size:.9rem;
}

/* ===== TOAST ===== */
#toast{
  position:fixed;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  background:#333;
  color:#fff;
  padding:8px 14px;
  border-radius:6px;
  display:none;
}
</style>
</head>

<body>

<header>
  <h2>Timeclock — <span id="clock">--:--:--</span></h2>
  <div class="search-form">
    <input type="text" id="search-input" placeholder="Search staff...">
    <button id="search-button">Search</button>
  </div>
</header>

<div id="summary">
  <span id="activeStaff">Active: None</span>
  <span id="lastAction">Last Action: -</span>
</div>

<main>

<ul id="staff-list">
  <li class="staff-item" data-id="1" data-name="John Doe">
    <div><strong>John Doe</strong><br>Manager</div>
  </li>
  <li class="staff-item" data-id="2" data-name="Jane Smith">
    <div><strong>Jane Smith</strong><br>Staff</div>
  </li>
  <li class="staff-item" data-id="3" data-name="Rachel Ying">
    <div><strong>Rachel Ying</strong><br>Staff</div>
  </li>
</ul>

<div id="timer">Shift Time: 00:00:00</div>

<div class="clock-buttons">
  <button id="clock-in" disabled>Clock In</button>
  <button id="clock-out" disabled>Clock Out</button>
</div>

<div id="log"></div>

</main>

<div id="toast"></div>

<script>
// ===== CLOCK =====
const clockSpan=document.getElementById("clock");
setInterval(()=>clockSpan.textContent=new Date().toLocaleTimeString(),1000);

// ===== STATE =====
let activeStaff=null;
let staffState={};
let logs=[];

const staffEls=document.querySelectorAll(".staff-item");
const clockInBtn=document.getElementById("clock-in");
const clockOutBtn=document.getElementById("clock-out");
const activeStaffSpan=document.getElementById("activeStaff");
const lastActionSpan=document.getElementById("lastAction");
const timerDiv=document.getElementById("timer");
const logDiv=document.getElementById("log");
const toast=document.getElementById("toast");

// ===== TOAST =====
function showToast(msg){
  toast.textContent=msg;
  toast.style.display="block";
  setTimeout(()=>toast.style.display="none",2000);
}

// ===== SELECT STAFF =====
staffEls.forEach(el=>{
  el.addEventListener("click",()=>{
    staffEls.forEach(s=>s.classList.remove("active"));
    el.classList.add("active");

    activeStaff={ id:el.dataset.id, name:el.dataset.name };
    activeStaffSpan.textContent="Active: "+activeStaff.name;

    if(!staffState[activeStaff.id]){
      staffState[activeStaff.id]={status:"out"};
    }
    updateButtons();
  });
});

// ===== BUTTON RULES =====
function updateButtons(){
  if(!activeStaff){
    clockInBtn.disabled=true;
    clockOutBtn.disabled=true;
    return;
  }
  const state=staffState[activeStaff.id].status;
  clockInBtn.disabled=state==="in";
  clockOutBtn.disabled=state==="out";
}

// ===== SHIFT TIMER =====
setInterval(()=>{
  if(activeStaff && staffState[activeStaff.id]?.status==="in"){
    const start=new Date(staffState[activeStaff.id].start);
    const diff=Math.floor((Date.now()-start)/1000);
    const h=String(Math.floor(diff/3600)).padStart(2,"0");
    const m=String(Math.floor(diff%3600/60)).padStart(2,"0");
    const s=String(diff%60).padStart(2,"0");
    timerDiv.textContent=`Shift Time: ${h}:${m}:${s}`;
  } else {
    timerDiv.textContent="Shift Time: 00:00:00";
  }
},1000);

// ===== LOG =====
function addLog(entry){
  logs.unshift(entry);
  renderLog();
}
function renderLog(){
  logDiv.innerHTML="";
  logs.forEach(l=>{
    const p=document.createElement("p");
    p.textContent=`${l.staff} ${l.action} at ${l.time}`;
    p.style.color=l.action==="clocked in"?"var(--in)":"var(--out)";
    logDiv.appendChild(p);
  });
}

// ===== CLOCK IN =====
clockInBtn.addEventListener("click",()=>{
  if(!activeStaff){showToast("Select staff first");return;}
  const now=new Date();
  staffState[activeStaff.id]={status:"in",start:now};
  addLog({staff:activeStaff.name,action:"clocked in",time:now.toLocaleTimeString()});
  lastActionSpan.textContent=`Last Action: IN at ${now.toLocaleTimeString()}`;
  updateButtons();
});

// ===== CLOCK OUT =====
clockOutBtn.addEventListener("click",()=>{
  if(!activeStaff){showToast("Select staff first");return;}
  const now=new Date();
  staffState[activeStaff.id].status="out";
  addLog({staff:activeStaff.name,action:"clocked out",time:now.toLocaleTimeString()});
  lastActionSpan.textContent=`Last Action: OUT at ${now.toLocaleTimeString()}`;
  updateButtons();
});

// ===== SEARCH (UNCHANGED BEHAVIOR) =====
document.getElementById("search-button").addEventListener("click",()=>{
  const query=document.getElementById("search-input").value.toLowerCase();
  staffEls.forEach(staff=>{
    staff.style.display=staff.dataset.name.toLowerCase().includes(query)?"flex":"none";
  });
});
</script>

</body>
</html>
{{ end }}
