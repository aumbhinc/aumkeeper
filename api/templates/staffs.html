{{ define "staffs" }}

<link
rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0">

<style>

/* =========================================
   SYSTEM TOKENS (ENTERPRISE CONSISTENCY)
========================================= */

:root{
    --primary:#0ea5e9;
    --primary-dark:#0284c7;

    --bg:#f4f7fb;
    --card:#ffffff;
    --border:#dbe4ee;

    --text:#0f172a;
    --muted:#64748b;

    --success:#10b981;

    --shadow:
        0 1px 2px rgba(0,0,0,.04),
        0 12px 30px rgba(15,23,42,.08);

    --radius:18px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    min-width:0;
}

/* =========================================
   PAGE SYSTEM
========================================= */

.staffs-page{
    display:flex;
    flex-direction:column;
    gap:18px;
}

/* =========================================
   COMMAND CENTER (CTO CONTROL LAYER)
========================================= */

.staffs-header{
    position:sticky;
    top:14px;
    z-index:100;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;

    padding:18px 20px;

    background:rgba(255,255,255,.85);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.7);
    border-radius:22px;

    box-shadow:var(--shadow);
}

.header-left{
    display:flex;
    gap:14px;
    align-items:center;
}

.header-icon{
    width:52px;
    height:52px;

    border-radius:16px;

    background:linear-gradient(135deg,#38bdf8,#2563eb);

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
}

.header-text h1{
    font-size:1.25rem;
    font-weight:800;
    color:var(--text);
}

.header-text p{
    font-size:.85rem;
    color:var(--muted);
    margin-top:3px;
}

/* =========================================
   BUTTON SYSTEM
========================================= */

.btn{
    border:none;
    border-radius:12px;

    padding:10px 14px;

    display:flex;
    align-items:center;
    gap:8px;

    font-weight:600;
    cursor:pointer;

    transition:.18s ease;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-primary:hover{
    background:var(--primary-dark);
}

.btn-secondary{
    background:white;
    border:1px solid var(--border);
}

/* =========================================
   TOOLBAR (SEARCH CONTROL LAYER)
========================================= */

.staff-toolbar{
    display:flex;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
}

.search-box{
    position:relative;
    flex:1;
    min-width:260px;
}

.search-box input{
    width:100%;
    padding:12px 14px 12px 44px;

    border:1px solid var(--border);
    border-radius:14px;

    outline:none;
}

.search-box input:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(14,165,233,.12);
}

/* =========================================
   KPI STRIP (SYSTEM HEALTH LAYER)
========================================= */

.staff-summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.summary-card{
    background:white;
    border:1px solid var(--border);

    border-radius:16px;
    padding:14px;

    box-shadow:var(--shadow);
}

.summary-value{
    font-size:1.3rem;
    font-weight:800;
}

.summary-label{
    font-size:.78rem;
    color:var(--muted);
}

/* =========================================
   STAFF GRID (ENTERPRISE CARD SYSTEM)
========================================= */

.staff-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
    gap:18px;
}

/* =========================================
   STAFF CARD (REDUCED NOISE DESIGN)
========================================= */

.staff-card{
    background:white;
    border:1px solid var(--border);

    border-radius:20px;
    padding:18px;

    display:flex;
    flex-direction:column;
    gap:14px;

    transition:.2s ease;
}

.staff-card:hover{
    transform:translateY(-2px);
    box-shadow:0 18px 40px rgba(15,23,42,.10);
}

/* TOP */
.staff-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.staff-profile{
    display:flex;
    gap:12px;
    align-items:center;
}

.avatar{
    width:44px;
    height:44px;

    border-radius:14px;
    background:linear-gradient(135deg,#38bdf8,#2563eb);

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    font-weight:700;
}

/* META */
.staff-name{
    font-weight:800;
    color:var(--text);
}

.staff-role{
    font-size:.8rem;
    color:var(--muted);
}

/* STATUS */
.status{
    padding:6px 10px;
    border-radius:999px;

    background:#ecfdf5;
    color:#059669;

    font-size:.72rem;
    font-weight:700;
}

/* =========================================
   PERFORMANCE CORE (KEY SIGNAL)
========================================= */

.performance{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.bar{
    height:6px;
    background:#e2e8f0;
    border-radius:999px;
    overflow:hidden;
}

.bar > div{
    height:100%;
    width:90%;
    background:linear-gradient(90deg,#0ea5e9,#2563eb);
}

/* =========================================
   METRICS ROW (SCANNABLE DATA)
========================================= */

.metrics{
    display:flex;
    justify-content:space-between;
}

.metric{
    display:flex;
    flex-direction:column;
    gap:2px;
}

.metric span:first-child{
    font-size:.7rem;
    color:var(--muted);
}

.metric span:last-child{
    font-weight:700;
    font-size:.85rem;
}

/* =========================================
   TASK (SOFT CONTEXT LAYER)
========================================= */

.task{
    font-size:.85rem;
    color:var(--text);
    padding-top:10px;
    border-top:1px solid #eef2f7;
}

/* =========================================
   ACTIONS (MINIMAL CTA LAYER)
========================================= */

.actions{
    display:flex;
    gap:10px;
}

.actions button{
    flex:1;
}

/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:900px){

    .staff-summary{
        grid-template-columns:repeat(2,1fr);
    }

    .staffs-header{
        flex-direction:column;
        align-items:flex-start;
    }

}

@media(max-width:700px){

    .staff-grid{
        grid-template-columns:1fr;
    }

}

</style>

<div class="staffs-page">

    <!-- COMMAND CENTER -->
    <section class="staffs-header">

        <div class="header-left">
            <div class="header-icon">
                <span class="material-symbols-rounded">groups</span>
            </div>

            <div class="header-text">
                <h1>Workforce Control Center</h1>
                <p>Enterprise HR OS • Payroll • Scheduling • Analytics</p>
            </div>
        </div>

        <div class="header-actions">
            <button class="btn btn-secondary" id="schedule-btn">
                <span class="material-symbols-rounded">calendar_month</span>
                Schedule
            </button>

            <button class="btn btn-secondary" id="payroll-btn">
                <span class="material-symbols-rounded">payments</span>
                Payroll
            </button>

            <button class="btn btn-primary" id="addstaff">
                <span class="material-symbols-rounded">person_add</span>
                Add Staff
            </button>
        </div>

    </section>

    <!-- KPI LAYER -->
    <section class="staff-summary">

        <div class="summary-card">
            <div class="summary-value">48</div>
            <div class="summary-label">Total Staff</div>
        </div>

        <div class="summary-card">
            <div class="summary-value">39</div>
            <div class="summary-label">Active Today</div>
        </div>

        <div class="summary-card">
            <div class="summary-value">$82K</div>
            <div class="summary-label">Payroll Cycle</div>
        </div>

        <div class="summary-card">
            <div class="summary-value">91%</div>
            <div class="summary-label">Avg Performance</div>
        </div>

    </section>

    <!-- GRID -->
    <section class="staff-grid" id="staff-grid">

        <!-- STAFF CARD -->
        <div class="staff-card">

            <div class="staff-top">

                <div class="staff-profile">
                    <div class="avatar">JD</div>

                    <div>
                        <div class="staff-name">John Doe</div>
                        <div class="staff-role">General Manager</div>
                    </div>
                </div>

                <div class="status">Active</div>

            </div>

            <div class="performance">
                <div class="metrics">
                    <div class="metric">
                        <span>Pay</span>
                        <span>$9K</span>
                    </div>

                    <div class="metric">
                        <span>Shift</span>
                        <span>Morning</span>
                    </div>

                    <div class="metric">
                        <span>Score</span>
                        <span>90</span>
                    </div>
                </div>

                <div class="bar"><div></div></div>
            </div>

            <div class="task">
                Overseeing ERP operational deployment
            </div>

            <div class="actions">
                <button class="btn btn-primary">Profile</button>
                <button class="btn btn-secondary">Edit</button>
            </div>

        </div>

    </section>

</div>

<script>

document.addEventListener("DOMContentLoaded", () => {

    const go = (id,url)=>{
        const el=document.getElementById(id);
        if(el) el.onclick=()=>window.location.href=url;
    };

    go("addstaff","/addstaff");
    go("schedule-btn","/schedule");
    go("payroll-btn","/payroll");

    const search=document.getElementById("search-input");
    const cards=document.querySelectorAll(".staff-card");

    search?.addEventListener("input",()=>{
        const q=search.value.toLowerCase();
        cards.forEach(c=>{
            c.style.display=c.innerText.toLowerCase().includes(q)?"flex":"none";
        });
    });

});

</script>

{{ end }}
