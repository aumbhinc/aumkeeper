{{ define "staffs" }}

<style>
:root{
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --primary:#2563eb;
  --shadow:0 10px 25px rgba(0,0,0,.06);
}

body{
  background:var(--bg);
}

/* TOP ACTION BAR */
.staffs-topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:1rem;
  padding:1rem;
  background:white;
  border-radius:1rem;
  box-shadow:var(--shadow);
  margin-bottom:1rem;
}

.top-actions{
  display:flex;
  flex-wrap:wrap;
  gap:.5rem;
}

.btn{
  padding:.5rem .8rem;
  border-radius:.6rem;
  border:none;
  cursor:pointer;
  font-size:.85rem;
  display:flex;
  align-items:center;
  gap:.4rem;
  transition:.2s;
}

.btn-primary{background:#0f172a;color:white;}
.btn-primary:hover{background:#1e293b;}

.btn-blue{background:var(--primary);color:white;}
.btn-blue:hover{background:#1d4ed8;}

/* MAIN LAYOUT */
.staffs-layout{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:1rem;
}

/* LEFT PANEL (WHO) */
.staffs-left{
  background:white;
  border-radius:1rem;
  box-shadow:var(--shadow);
  padding:1rem;
  height:calc(100vh - 140px);
  overflow:auto;
}

.search-box{
  width:100%;
  padding:.5rem;
  border:1px solid #e2e8f0;
  border-radius:.6rem;
  margin-bottom:.8rem;
}

.staff-list{
  display:flex;
  flex-direction:column;
  gap:.5rem;
}

.staff-card{
  padding:.8rem;
  border-radius:.8rem;
  cursor:pointer;
  transition:.2s;
  border:1px solid transparent;
}

.staff-card:hover{
  background:#f8fafc;
}

.staff-card.active{
  border:1px solid var(--primary);
  background:#eff6ff;
}

/* RIGHT PANEL (WHAT) */
.staffs-right{
  display:flex;
  flex-direction:column;
  gap:1rem;
}

.panel{
  background:white;
  border-radius:1rem;
  box-shadow:var(--shadow);
  padding:1rem;
}

.staff-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.badge{
  font-size:.75rem;
  padding:.2rem .5rem;
  border-radius:999px;
  background:#e2e8f0;
}

/* TASKS */
.task{
  padding:.6rem;
  border-left:3px solid var(--primary);
  margin-bottom:.5rem;
  background:#f8fafc;
  border-radius:.5rem;
}

.small{
  font-size:.85rem;
  color:var(--muted);
}

/* MOBILE */
@media(max-width:900px){
  .staffs-layout{
    grid-template-columns:1fr;
  }
  .staffs-left{
    height:auto;
  }
}
</style>

<!-- TOP BAR -->
<section class="staffs-topbar">
  <h2 style="margin:0;font-size:1.2rem;">Staffs Manager</h2>

  <div class="top-actions">
    <button class="btn btn-blue" id="addstaff">
      <span class="material-icons-sharp">person_add</span> Add Staff
    </button>

    <button class="btn btn-primary" id="timeclock-btn">Timeclock</button>
    <button class="btn btn-primary" id="payroll-btn">Payroll</button>
    <button class="btn btn-primary" id="reports-btn">Reports</button>
  </div>
</section>

<!-- MAIN LAYOUT -->
<section class="staffs-layout">

  <!-- LEFT: WHO -->
  <aside class="staffs-left">
    <input class="search-box" id="search-input" placeholder="Search staff...">

    <div class="staff-list" id="staff-list">

      <div class="staff-card active">
        <strong>John Doe</strong>
        <div class="small">General Manager</div>
      </div>

      <div class="staff-card">
        <strong>Jane Smith</strong>
        <div class="small">Staff</div>
      </div>

      <div class="staff-card">
        <strong>Rachel Ying</strong>
        <div class="small">Manager</div>
      </div>

    </div>
  </aside>

  <!-- RIGHT: WHAT -->
  <main class="staffs-right">

    <!-- OVERVIEW -->
    <div class="panel">
      <div class="staff-header">
        <div>
          <h3 style="margin:0;">John Doe</h3>
          <div class="small">General Manager • Active</div>
        </div>
        <span class="badge">Task Score: 90%</span>
      </div>
    </div>

    <!-- TASKS -->
    <div class="panel">
      <h4 style="margin-top:0;">Assigned Tasks</h4>

      <div class="task">
        Design UI for new project
      </div>

      <div class="task">
        Review onboarding pipeline
      </div>

    </div>

    <!-- PERFORMANCE -->
    <div class="panel">
      <h4 style="margin-top:0;">Performance</h4>
      <div class="small">Completion Rate: 92%</div>
      <div class="small">On-time Rate: 88%</div>
    </div>

  </main>

</section>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const redirect = (id, url) => {
    const el = document.getElementById(id);
    if(!el) return;
    el.onclick = () => window.location.href = url;
  };

  redirect("addstaff","/addstaff");
  redirect("timeclock-btn","/timeclock");
  redirect("payroll-btn","/payroll");
  redirect("reports-btn","/staff-reports");

});
</script>

{{ end }}
