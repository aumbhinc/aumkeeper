{{ define "staffs" }}

<style>
:root{
  --bg:#f6f8fc;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#6b7280;
  --line:#e5e7eb;
  --blue:#2563eb;
  --soft:#eff6ff;
}

body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
}

/* TOP BAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
}

.title{
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
}

.actions{
  display:flex;
  gap:8px;
}

.btn{
  font-size:12px;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid var(--line);
  background:white;
  cursor:pointer;
}

/* MAIN LAYOUT */
.grid{
  display:grid;
  grid-template-columns:320px 1fr; /* LEFT dominates control clarity */
  gap:14px;
  padding:0 14px 14px;
  height:calc(100vh - 70px);
}

/* LEFT = WHO */
.left{
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
  overflow:auto;
}

.search{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--line);
  font-size:13px;
  margin-bottom:10px;
}

.person{
  padding:12px;
  border-radius:12px;
  cursor:pointer;
  margin-bottom:8px;
  transition:.15s;
}

.person:hover{
  background:#f8fafc;
}

.person.active{
  background:var(--soft);
  border:1px solid #bfdbfe;
}

.name{
  font-size:13px;
  font-weight:600;
}

.role{
  font-size:11px;
  color:var(--muted);
}

/* RIGHT = TASK STREAM ONLY */
.right{
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  overflow:auto;
}

/* HEADER */
.task-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.task-header h2{
  margin:0;
  font-size:16px;
}

.sub{
  font-size:12px;
  color:var(--muted);
}

/* TASKS ONLY FOCUS */
.task{
  padding:12px;
  border-left:3px solid var(--blue);
  background:#f8fafc;
  border-radius:10px;
  margin-bottom:8px;
  font-size:13px;
}

.task-meta{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

/* MOBILE */
@media(max-width:900px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>

<!-- TOP -->
<div class="topbar">
  <div class="title">Staff Operations</div>

  <div class="actions">
    <button class="btn">Add Task</button>
    <button class="btn">Add Staff</button>
    <button class="btn">Time</button>
    <button class="btn">Reports</button>
  </div>
</div>

<!-- GRID -->
<div class="grid">

  <!-- LEFT: WHO -->
  <aside class="left">

    <input class="search" placeholder="Search staff...">

    <div class="person active">
      <div class="name">John Doe</div>
      <div class="role">General Manager</div>
    </div>

    <div class="person">
      <div class="name">Jane Smith</div>
      <div class="role">Staff</div>
    </div>

    <div class="person">
      <div class="name">Rachel Ying</div>
      <div class="role">Manager</div>
    </div>

  </aside>

  <!-- RIGHT: TASK STREAM ONLY -->
  <main class="right">

    <div class="task-header">
      <div>
        <h2>Tasks</h2>
        <div class="sub">Assigned to selected staff</div>
      </div>
    </div>

    <div class="task">
      Design UI system
      <div class="task-meta">Due: Tomorrow • High Priority</div>
    </div>

    <div class="task">
      Review onboarding flow
      <div class="task-meta">Due: 3 days • Medium Priority</div>
    </div>

    <div class="task">
      Fix dashboard renderer bug
      <div class="task-meta">Due: Today • Critical</div>
    </div>

  </main>

</div>

{{ end }}
