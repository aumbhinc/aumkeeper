{{ define "staffs" }}

<link
rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0">

<style>

/* =========================================
   ROOT
========================================= */

:root{
    --primary:#0ea5e9;
    --primary-dark:#0284c7;

    --bg:#f4f7fb;
    --card:#ffffff;
    --border:#e6edf5;

    --text:#0f172a;
    --muted:#64748b;

    --success:#10b981;

    --shadow:
        0 1px 2px rgba(0,0,0,.04),
        0 10px 30px rgba(15,23,42,.06);

    --radius:18px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* =========================================
   PAGE
========================================= */

.staffs-page{
    display:flex;
    flex-direction:column;
    gap:16px;
}

/* =========================================
   COMMAND CENTER
========================================= */

.hr-command{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:18px;

    padding:18px 20px;

    background:white;
    border:1px solid var(--border);
    border-radius:22px;

    box-shadow:var(--shadow);
}

.hr-title{
    font-size:1.2rem;
    font-weight:800;
    color:var(--text);
}

.hr-sub{
    font-size:.85rem;
    color:var(--muted);
    margin-top:4px;
}

.command-actions{
    display:flex;
    gap:10px;
    align-items:center;
}

.hr-search{
    width:280px;
    padding:12px 14px;

    border-radius:14px;
    border:1px solid var(--border);
    outline:none;
}

.hr-search:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(14,165,233,.15);
}

/* =========================================
   KPI STRIP
========================================= */

.hr-kpis{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.kpi{
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    padding:14px;

    box-shadow:var(--shadow);
}

.kpi-value{
    font-size:1.4rem;
    font-weight:800;
    color:var(--text);
}

.kpi-label{
    font-size:.78rem;
    color:var(--muted);
}

/* =========================================
   HR TABLE
========================================= */

.hr-table{
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* ROW */
.hr-row{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:14px 16px;

    background:white;
    border:1px solid var(--border);
    border-radius:16px;

    transition:.2s ease;
}

.hr-row:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 25px rgba(15,23,42,.08);
}

/* LEFT */
.row-main{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:220px;
}

.avatar{
    width:42px;
    height:42px;

    border-radius:14px;
    background:linear-gradient(135deg,#38bdf8,#2563eb);

    color:white;
    font-weight:700;

    display:flex;
    align-items:center;
    justify-content:center;
}

.row-info .name{
    font-weight:700;
    color:var(--text);
}

.row-info .meta{
    font-size:.78rem;
    color:var(--muted);
}

/* CHIPS */
.chips{
    display:flex;
    gap:6px;
    margin-top:4px;
}

.chip{
    font-size:.7rem;
    padding:3px 8px;
    border-radius:999px;

    background:#f1f5f9;
    color:#475569;
    border:1px solid #e2e8f0;
}

/* MIDDLE */
.row-metrics{
    display:flex;
    gap:22px;
    flex:1;
    justify-content:center;
}

.metric{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.metric .label{
    font-size:.7rem;
    color:var(--muted);
}

.metric .value{
    font-size:.9rem;
    font-weight:700;
}

.good{
    color:var(--success);
}

/* RIGHT */
.row-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:36px;
    height:36px;

    border-radius:10px;
    border:1px solid var(--border);

    background:#f8fafc;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.icon-btn:hover{
    background:#eef2f7;
}

/* =========================================
   BUTTONS
========================================= */

.btn{
    border:none;
    border-radius:14px;
    padding:10px 14px;

    display:flex;
    align-items:center;
    gap:8px;

    cursor:pointer;
    font-weight:600;
    font-size:.9rem;
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-primary:hover{
    background:var(--primary-dark);
}

.btn-secondary{
    background:#f8fafc;
    border:1px solid var(--border);
}

/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:900px){

    .hr-command{
        flex-direction:column;
        align-items:flex-start;
    }

    .command-actions{
        width:100%;
    }

    .hr-search{
        width:100%;
    }

    .hr-kpis{
        grid-template-columns:repeat(2,1fr);
    }

    .hr-row{
        flex-direction:column;
        align-items:flex-start;
        gap:12px;
    }

    .row-metrics{
        justify-content:flex-start;
        flex-wrap:wrap;
    }
}

</style>

<div class="staffs-page">

    <!-- COMMAND CENTER -->
    <section class="hr-command">

        <div>
            <div class="hr-title">Workforce Control Center</div>
            <div class="hr-sub">Search, filter, and manage staff in real time</div>
        </div>

        <div class="command-actions">

            <input
                id="search-input"
                class="hr-search"
                placeholder="Search staff, role, department..." />

            <button class="btn btn-secondary">
                <span class="material-symbols-rounded">filter_list</span>
                Filters
            </button>

            <button class="btn btn-primary" id="addstaff">
                <span class="material-symbols-rounded">person_add</span>
                Add Staff
            </button>

        </div>

    </section>

    <!-- KPI STRIP -->
    <section class="hr-kpis">

        <div class="kpi">
            <div class="kpi-value">48</div>
            <div class="kpi-label">Total Staff</div>
        </div>

        <div class="kpi">
            <div class="kpi-value">39</div>
            <div class="kpi-label">Active Today</div>
        </div>

        <div class="kpi">
            <div class="kpi-value">$82K</div>
            <div class="kpi-label">Payroll Cycle</div>
        </div>

        <div class="kpi">
            <div class="kpi-value">91%</div>
            <div class="kpi-label">Avg Performance</div>
        </div>

    </section>

    <!-- TABLE -->
    <section class="hr-table" id="staff-grid">

        <!-- STAFF ROW -->
        <div class="hr-row">

            <div class="row-main">

                <div class="avatar">JD</div>

                <div class="row-info">

                    <div class="name">John Doe</div>
                    <div class="meta">General Manager</div>

                    <div class="chips">
                        <span class="chip">Operations</span>
                        <span class="chip">Morning Shift</span>
                    </div>

                </div>

            </div>

            <div class="row-metrics">

                <div class="metric">
                    <div class="label">Performance</div>
                    <div class="value good">90</div>
                </div>

                <div class="metric">
                    <div class="label">Pay</div>
                    <div class="value">$9K</div>
                </div>

                <div class="metric">
                    <div class="label">Status</div>
                    <div class="value good">Active</div>
                </div>

            </div>

            <div class="row-actions">

                <button class="icon-btn">
                    <span class="material-symbols-rounded">visibility</span>
                </button>

                <button class="icon-btn">
                    <span class="material-symbols-rounded">edit</span>
                </button>

            </div>

        </div>

    </section>

</div>

<script>

document.addEventListener("DOMContentLoaded", () => {

    const redirect = (id, url) => {
        const el = document.getElementById(id);
        if(el){
            el.addEventListener("click", () => {
                window.location.href = url;
            });
        }
    };

    redirect("addstaff", "/addstaff");

    const searchInput = document.getElementById("search-input");
    const cards = document.querySelectorAll(".hr-row");

    searchInput?.addEventListener("input", () => {
        const q = searchInput.value.toLowerCase();

        cards.forEach(card => {
            const text = card.innerText.toLowerCase();
            card.style.display = text.includes(q) ? "flex" : "none";
        });
    });

});

</script>

{{ end }}
